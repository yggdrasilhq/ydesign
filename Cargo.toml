[package]
name = "ydesign"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "The yggui base design language as live notebooks — a libyggterm document-surface app for yggterm"
repository = "https://github.com/yggdrasilhq/ydesign"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
